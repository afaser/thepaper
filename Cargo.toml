[package]
name = "thepaper"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"
description = "Zero-copy VA-API/Vulkan live video wallpaper for niri"

[dependencies]
anyhow = "1.0"
calloop = "0.14"
calloop-wayland-source = "0.4"
clap = { version = "4.5", features = ["derive"] }
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec", "avformat"] }
futures-util = "0.3"
libc = "0.2"
niri-ipc = "26.4"
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "system"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
toml = "0.9"
wayland-client = { version = "0.31", features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30.0", default-features = false, features = ["vulkan", "wgsl", "std"] }
zbus = "6.5"
